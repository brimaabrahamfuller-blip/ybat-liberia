<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YBAT Community Account</title><link rel="stylesheet" href="/styles.css"></head><body class="admin-page"><main class="admin-shell"><a class="text-link" href="/">← Back to YBAT Liberia</a><header class="admin-header"><div><p class="eyebrow">YBAT community</p><h1>Your profile and opportunities</h1><p>Join as a young person, mentor, or partner so YBAT can keep you connected to opportunities.</p></div></header><section id="account-auth" class="admin-grid"><article class="admin-card"><h2>Sign in</h2><form id="login" class="form-grid"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><button class="button button-dark">Sign in</button><p id="login-message" class="form-status"></p></form></article><article class="admin-card"><h2>Create profile</h2><form id="register" class="form-grid"><label>Name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Role<select name="role"><option value="member">Young person</option><option value="mentor">Mentor</option><option value="partner">Partner</option></select></label><label>Organization (optional)<input name="organization"></label><label>Password<input name="password" type="password" minlength="8" required></label><button class="button button-dark">Create profile</button><p id="register-message" class="form-status"></p></form></article></section><section id="profile" class="admin-card" hidden><p class="eyebrow">Signed in</p><h2 id="profile-name"></h2><p id="profile-details"></p><button id="logout" class="button button-outline">Sign out</button></section></main><script>const API=window.YBAT_API_URL||'';const message=(id,text,error=false)=>{const e=document.querySelector(id);e.textContent=text;e.className='form-status '+(error?'error':'success')};const show=async token=>{try{const r=await fetch(API+'/api/auth/me',{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok)throw Error();document.querySelector('#account-auth').hidden=true;document.querySelector('#profile').hidden=false;document.querySelector('#profile-name').textContent='Welcome, '+d.user.name;document.querySelector('#profile-details').textContent=`${d.user.role} · ${d.user.email}${d.user.organization?' · '+d.user.organization:''}`}catch{localStorage.removeItem('ybat_token')}};document.querySelector('#login').addEventListener('submit',async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(e.target));const d=await fetch(API+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json());if(d.token){localStorage.setItem('ybat_token',d.token);show(d.token)}else message('#login-message',d.error,true)});document.querySelector('#register').addEventListener('submit',async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(e.target));const d=await fetch(API+'/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json());if(d.token){localStorage.setItem('ybat_token',d.token);show(d.token)}else message('#register-message',d.error,true)});document.querySelector('#logout').addEventListener('click',()=>{localStorage.removeItem('ybat_token');location.reload()});if(localStorage.getItem('ybat_token'))show(localStorage.getItem('ybat_token'));</script></body></html>
