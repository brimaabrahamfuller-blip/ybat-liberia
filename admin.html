<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YBAT Staff Admin</title><link rel="stylesheet" href="/styles.css"></head><body class="admin-page"><main class="admin-shell"><a class="text-link" href="/">← Back to website</a><header class="admin-header"><div><p class="eyebrow">YBAT staff area</p><h1>Content dashboard</h1><p>Update public content, publish activity, and review incoming submissions.</p></div><button id="logout" class="button button-outline">Sign out</button></header><section id="login-panel" class="admin-card"><h2>Staff sign in</h2><form id="login-form" class="form-grid"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><button class="button button-dark">Sign in</button><p id="login-status" class="form-status"></p></form></section><section id="dashboard" hidden><div class="admin-grid"><article class="admin-card"><h2>Homepage copy</h2><form id="content-form" class="form-grid"><label>Hero title<textarea name="heroTitle" rows="2"></textarea></label><label>Hero copy<textarea name="heroCopy" rows="3"></textarea></label><label>About title<textarea name="aboutTitle" rows="2"></textarea></label><label>About body<textarea name="aboutBody" rows="3"></textarea></label><label>Contact email<input name="contactEmail" type="email"></label><label>Primary phone<input name="phonePrimary"></label><label>Secondary phone<input name="phoneSecondary"></label><button class="button button-dark">Save homepage</button><p id="content-status" class="form-status"></p></form></article><article class="admin-card"><h2>Publish something</h2><div class="admin-tabs"><button data-tab="program" class="active">Program</button><button data-tab="event">Event</button><button data-tab="story">Story</button><button data-tab="impact">Impact</button></div><form id="publish-form" class="form-grid"><input type="hidden" name="type" value="program"><label>Title<input name="title" required></label><label>Summary / body<textarea name="summary" rows="4" required></textarea></label><label>Date or value<input name="extra"></label><label>Location or image URL<input name="extra2"></label><button class="button button-dark">Publish</button><p id="publish-status" class="form-status"></p></form></article></div><article class="admin-card"><div class="card-heading"><h2>Inbox</h2><button id="refresh" class="button button-outline">Refresh</button></div><div id="submissions" class="admin-list"></div></article></section></main><script src="/admin.js" defer></script></body></html>
